# Dev Home Assistant configuration.
default_config:

# Load the scripts saved by the UI script editor (config/scripts.yaml, which
# scripts/develop creates when missing). Without this, saving a script in the
# UI times out because nothing loads it.
script: !include scripts.yaml

logger:
  default: info
  logs:
    custom_components.com_system: debug

# Debugger: attach with the "Home Assistant: attach" launch config.
# Home Assistant does not wait for the debugger (wait: false).
debugpy:
  start: true
  wait: false
  host: 0.0.0.0
  port: 5678

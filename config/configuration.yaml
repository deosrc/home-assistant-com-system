# Dev Home Assistant configuration.
default_config:

# Load what the UI editors save (config/automations.yaml, scripts.yaml and
# scenes.yaml, which scripts/develop creates when missing). Without these,
# saving in the UI times out because nothing loads the result.
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  logs:
    custom_components.com_system: debug

# Debugger: attach with the "Home Assistant: attach" launch config.
# Home Assistant does not wait for the debugger (wait: false).
debugpy:
  start: true
  wait: false
  host: 0.0.0.0
  port: 5678

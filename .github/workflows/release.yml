name: Release

# HACS installs the zip attached to the release, because the compiled panel
# is not committed.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Set the manifest version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Strip a leading "v" so tags like v1.2.3 give version 1.2.3.
          version="${TAG#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/com_system/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/com_system/manifest.json
          grep '"version"' custom_components/com_system/manifest.json
      - name: Zip the integration
        run: |
          cd custom_components/com_system
          zip -r ../../com_system.zip . -x "__pycache__/*" "*/__pycache__/*"
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" com_system.zip --clobber

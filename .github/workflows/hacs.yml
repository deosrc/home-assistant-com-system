name: HACS validation

# Disabled while the repository is private: the HACS action cannot validate a
# private repository. Restore the push, pull_request and schedule triggers
# (push and pull_request on main, nightly at 00:00) once it is public.
on:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
